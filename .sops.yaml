keys:
  - &abhro 
  - &earth 
  - &pluto age1m4d87mngyen9a2x45rgs5tpc5rsss0qu68qtdezpudeagn7qmveqffxnua
creation_rules:
  - path_regex: secrets/host\.(yaml|enc)$
    key_groups:
      - age:
          - *abhro
          - *earth
          - *pluto
  - path_regex: secrets/earth\.(yaml|enc)$
    key_groups:
      - age:
          - *abhro
          - *earth
  - path_regex: secrets/pluto\.(yaml|enc)$
    key_groups:
      - age:
          - *abhro
          - *pluto
  - path_regex: secrets/[^/]+\.(yaml|enc)$
    key_groups:
      - age:
          - *abhro
