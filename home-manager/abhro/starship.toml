"$schema" = "https://starship.rs/config-schema.json"

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$docker_context\
$nix_shell\
$direnv\
$cmd_duration\
$line_break\
$jobs\
$battery\
$status\
$container\
$character
"""

right_format = "$all"

[directory.substitutions]
"Desktop" = " "
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Public" = "󰒗 "
